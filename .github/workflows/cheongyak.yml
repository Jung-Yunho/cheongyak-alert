name: 청약 알림

on:
  schedule:
    # GitHub 의 cron 은 UTC 다. 23:00 UTC = 다음 날 08:00 KST.
    # 예약 실행은 러너가 붐비면 수십 분~1시간 밀린다(실측 67분). 그래서 09시가 아니라
    # 08시에 걸어 밀리더라도 오전 중에 도착하게 한다.
    - cron: '0 23 * * *'
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write           # 결과(docs, seen.txt)를 저장소에 다시 커밋해야 한다

concurrency:
  group: cheongyak          # 겹쳐 돌면 push 가 충돌한다
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 수집 · 알림 · 페이지 생성
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          APPLYHOME_KEY: ${{ secrets.APPLYHOME_KEY }}
          # 안 만들면 빈 값 -> 기본 "서울,경기,인천". 전국을 보려면 값을 "전국" 으로.
          APT_REGIONS: ${{ vars.APT_REGIONS }}
          # 텔레그램 메시지 맨 끝에 붙는 링크. Pages 주소가 바뀌면 여기도 바꾼다.
          WEB_URL: https://jung-yunho.github.io/cheongyak-alert/
        run: |
          java -Dfile.encoding=UTF-8 -Dcheongyak.dir=. \
               Cheongyak.java --html docs/index.html

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs seen.txt
          # 바뀐 게 없으면 커밋하지 않는다. 없는 상태로 commit 하면 실패로 잡힌다.
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "청약 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
